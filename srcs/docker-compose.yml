x-secret-files:
  db_root_password: ${DB_ROOT_PASSWORD_FILE:-../secrets/db_root_password.txt}
  db_password: ${DB_PASSWORD_FILE:-../secrets/db_password.txt}
  wp_admin_password: ${WP_ADMIN_PASSWORD_FILE:-../secrets/wp_admin_password.txt}
  wp_user_password: ${WP_USER_PASSWORD_FILE:-../secrets/wp_user_password.txt}

services:
  nginx:
    build:
      context: ./requirements/nginx
    image: ${STACK_IMAGE_PREFIX:-container-stack}-nginx:${STACK_IMAGE_TAG:-local}
    restart: unless-stopped
    cpus: ${NGINX_CPUS:-0.50}
    mem_limit: ${NGINX_MEMORY:-128m}
    pids_limit: ${NGINX_PIDS_LIMIT:-64}
    ulimits:
      nofile:
        soft: ${NGINX_NOFILE_SOFT:-1024}
        hard: ${NGINX_NOFILE_HARD:-4096}
    stop_signal: SIGQUIT
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?set DOMAIN_NAME}
    ports:
      - "${HTTPS_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    depends_on:
      wordpress:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  mariadb:
    build:
      context: ./requirements/mariadb
    image: ${STACK_IMAGE_PREFIX:-container-stack}-mariadb:${STACK_IMAGE_TAG:-local}
    restart: unless-stopped
    cpus: ${MARIADB_CPUS:-1.00}
    mem_limit: ${MARIADB_MEMORY:-512m}
    pids_limit: ${MARIADB_PIDS_LIMIT:-256}
    ulimits:
      nofile:
        soft: ${MARIADB_NOFILE_SOFT:-4096}
        hard: ${MARIADB_NOFILE_HARD:-65536}
    stop_signal: SIGTERM
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
    volumes:
      - mariadb_data:/var/lib/mysql-volume
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/mysql-volume/data/.container-stack-initialized && test -S /run/mysqld/mysqld.sock && kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  wordpress:
    build:
      context: ./requirements/wordpress
    image: ${STACK_IMAGE_PREFIX:-container-stack}-wordpress:${STACK_IMAGE_TAG:-local}
    restart: unless-stopped
    cpus: ${WORDPRESS_CPUS:-1.00}
    mem_limit: ${WORDPRESS_MEMORY:-512m}
    pids_limit: ${WORDPRESS_PIDS_LIMIT:-256}
    ulimits:
      nofile:
        soft: ${WORDPRESS_NOFILE_SOFT:-1024}
        hard: ${WORDPRESS_NOFILE_HARD:-4096}
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?set DOMAIN_NAME}
      WORDPRESS_URL: ${WORDPRESS_URL:?set WORDPRESS_URL}
      WORDPRESS_DB_HOST: mariadb
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      WORDPRESS_TITLE: ${WORDPRESS_TITLE:?set WORDPRESS_TITLE}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER:?set WORDPRESS_ADMIN_USER}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:?set WORDPRESS_ADMIN_EMAIL}
      WORDPRESS_USER: ${WORDPRESS_USER:?set WORDPRESS_USER}
      WORDPRESS_USER_EMAIL: ${WORDPRESS_USER_EMAIL:?set WORDPRESS_USER_EMAIL}
    volumes:
      - wordpress_data:/var/www/html
      - wordpress_config:/var/www/config
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/.container-stack-initialized && REQUEST_METHOD=GET SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  mariadb_data:
  wordpress_data:
  wordpress_config:
