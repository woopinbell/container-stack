[www]
user = www-data
group = www-data

# [INTV:ARCH] 유닉스 소켓이 아니라 TCP로 모든 인터페이스에서 수신 — 같은 컨테이너가 아니라 nginx
# 컨테이너가 네트워크 너머에서 fastcgi_pass wordpress:9000으로 접속해 오기 때문(nginx.conf와 짝을 이룸).
listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data

# [INTV:PERF] php-fpm 프로세스 매니저 모드: 요청량에 따라 워커 프로세스 수를 min~max 사이에서 늘리고
# 줄인다(고정 개수인 static과 대비) — 트래픽이 적을 때 메모리를 아끼는 대신, 급증 시 워커 기동 지연이
# 생길 수 있는 트레이드오프.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5

# [INTV:EDGE] 셸에서 물려받은 환경변수를 워커 프로세스에서 지운다 — DB 접속 정보 등은 이미
# wp-config.php 파일에 값으로 박아뒀으므로(entrypoint 참고) 요청 처리 시점에 환경변수로 넘길 필요가
# 없어, 굳이 노출시키지 않는 편이 안전하다.
clear_env = yes
catch_workers_output = yes

# docker-compose.yml의 wordpress healthcheck가 cgi-fcgi로 호출하는 바로 그 경로/응답.
ping.path = /ping
ping.response = pong

# [INTV:ARCH] 로그를 파일이 아니라 컨테이너의 표준출력/표준에러로 흘려보냄 — Docker의 로깅 드라이버
# (compose의 json-file)가 그대로 수집할 수 있도록 "컨테이너 로그는 stdout/stderr로"라는 관례를 따른 것.
access.log = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
