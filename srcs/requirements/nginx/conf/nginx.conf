server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name _;
    root /var/www/html;
    index index.php index.html;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # [INTV:ARCH] 이 인증서/키 파일은 이 설정이 만드는 게 아니라, nginx entrypoint 스크립트가 컨테이너
    # 시작 시 생성해 두는 것 (Dockerfile/entrypoint.sh 참고) — 설정과 프로비저닝의 책임이 분리되어 있다.
    ssl_certificate /etc/nginx/ssl/container-stack.crt;
    ssl_certificate_key /etc/nginx/ssl/container-stack.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # [INTV:TRADE_OFF] TLS 1.3부터는 클라이언트가 암호 스위트를 고르는 방식이 표준 권장이라, 서버가
    # 우선순위를 강제하지 않도록 끈다.
    ssl_prefer_server_ciphers off;

    client_max_body_size 64m;

    # [INTV:EDGE] 응답 헤더로 브라우저에 지시하는 표준 웹 보안 방어선: MIME 스니핑 금지, 다른 사이트
    # iframe에 끼워넣기 금지, Referer 헤더에 담기는 정보 최소화.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # docker-compose.yml의 nginx healthcheck가 호출하는 바로 그 엔드포인트.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        # [INTV:ARCH] 워드프레스의 "예쁜 permalink"(예: /2024/hello-world/)를 처리하는 표준 프런트
        # 컨트롤러 패턴 — 실제 파일/디렉터리가 없는 요청은 모두 index.php로 넘겨 워드프레스 라우팅이
        # 처리하게 한다.
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # [INTV:ARCH] PHP 실행은 이 컨테이너가 아니라 wordpress 컨테이너의 php-fpm이 담당 — FastCGI
        # 프로토콜로 위임한다 (포트 9000은 wordpress Dockerfile의 EXPOSE, php-fpm의 listen 설정과 짝).
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        # [INTV:EDGE] TLS는 여기 nginx에서 끝나고(TLS termination) 뒷단(php-fpm)과는 평문 FastCGI로
        # 통신하므로, 워드프레스가 스스로는 HTTPS 여부를 알 방법이 없다 — 이 파라미터로 "이 요청은
        # 사실 HTTPS였다"는 사실을 대신 알려준다.
        # - [TRAP] 이 파라미터를 빼먹으면 워드프레스가 요청을 평문 HTTP로 착각해, 관리자 페이지 등에서
        #   무한 리다이렉트나 혼합 콘텐츠(mixed content) 경고를 일으킨다.
        fastcgi_param HTTPS on;
    }

    # 점(.)으로 시작하는 경로(.env, .git, .htaccess 등) 접근을 전부 차단.
    location ~ /\. {
        deny all;
    }
}
